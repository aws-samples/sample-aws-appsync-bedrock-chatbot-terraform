type Message {
  id: ID!
  conversationId: ID!
  content: String!
  role: String!  # "user" or "assistant"
  timestamp: AWSDateTime!
  isComplete: Boolean
}

type MessageUpdate @aws_iam {
  messageId: ID!
  conversationId: ID!
  content: String!
  isComplete: Boolean!
  timestamp: AWSDateTime!
}

type Conversation {
  id: ID!
  userId: String!
  title: String
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

enum DocumentStatus {
  PROCESSING
  PROCESSED
  FAILED
}

type UserDocument {
  id: ID!
  userId: String!
  documentName: String!
  documentType: String!
  uploadTimestamp: AWSDateTime!
  status: DocumentStatus!
  size: Int!
  pageCount: Int
  ingestionJobId: String
}

type DocumentUploadUrl {
  uploadUrl: String!
  documentId: ID!
}

type Query {
  getMessage(id: ID!): Message
  getConversation(id: ID!): Conversation
  listConversations: [Conversation]
  listRecentConversations(limit: Int): [Conversation]
  getMessages(conversationId: ID!): [Message]
  
  # Document operations
  listUserDocuments: [UserDocument]
  getDocument(id: ID!): UserDocument
}

type Mutation {
  sendMessage(conversationId: ID!, content: String!): Message
  createConversation(title: String): Conversation
  updateMessageContent(messageId: ID!, conversationId: ID!, content: String!, isComplete: Boolean!): MessageUpdate
    @aws_iam
    
  # Document operations
  getDocumentUploadUrl(fileName: String!, contentType: String!): DocumentUploadUrl
  deleteUserDocument(id: ID!): Boolean
  askDocumentQuestion(documentIds: [ID!]!, question: String!): Message
}

type Subscription {
  onNewMessage(conversationId: ID!): Message
    @aws_subscribe(mutations: ["sendMessage"])
  
  onMessageUpdate(conversationId: ID!): MessageUpdate
    @aws_subscribe(mutations: ["updateMessageContent"])
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}
